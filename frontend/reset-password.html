<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Atlas Property Group</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: var(--light-gray); }
        .auth-page { display: grid; grid-template-columns: 1.2fr 1fr; min-height: 100vh; }
        .auth-image { min-height: 100vh; background-image: url('asset/image1.jpg'); background-size: cover; background-position: center; }
        .auth-form-container { display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--light-gray); }
        .auth-form-card { width: 100%; max-width: 430px; background: var(--white); padding: 32px; box-shadow: none; }
        .auth-form-card .auth-logo-img { width: 220px; margin-bottom: 22px; }
        .auth-form-card h1 { font-size: 2rem; color: var(--primary-blue); margin-bottom: 10px; }
        .auth-form-card p { color: var(--medium-gray); margin-bottom: 24px; line-height: 1.6; }
        .auth-form-card input { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 16px; }
        .auth-form-card .btn-primary { width: 100%; padding: 16px 0; border-radius: 12px; }
        .status { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 0.95rem; }
        .status.success { background: #eaf7ee; color: #17653f; }
        .status.error { background: #fdeeee; color: #b42318; }
        @media (max-width: 992px) { .auth-page { grid-template-columns: 1fr; } .auth-image { display: none; } }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-image"></div>
        <div class="auth-form-container">
            <div class="auth-form-card">
                <a href="index.html" class="logo"><img src="asset/logo8.png" alt="Atlas Property Group Logo" class="auth-logo-img"></a>
                <h1>Choose a new password</h1>
                <p>Enter a new password for your Atlas account. Once it’s saved, you can sign in immediately.</p>
                <form id="reset-password-form">
                    <input type="password" id="new-password" placeholder="Enter new password" required>
                    <input type="password" id="confirm-password" placeholder="Confirm new password" required>
                    <button type="submit" class="btn btn-primary">Save new password</button>
                </form>
                <div id="reset-status" class="status" style="display:none"></div>
            </div>
        </div>
    </div>
    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { confirmPasswordReset } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        const params = new URLSearchParams(window.location.search);
        const actionCode = params.get('oobCode') || params.get('oob_code') || params.get('access_token') || params.get('token');
        const form = document.getElementById('reset-password-form');
        const status = document.getElementById('reset-status');

        if (!actionCode) {
            status.className = 'status error';
            status.textContent = 'The recovery link is missing a valid reset code.';
            status.style.display = 'block';
        }

        form?.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            status.style.display = 'none';
            status.className = 'status';

            if (password.length < 6) {
                status.className = 'status error';
                status.textContent = 'Please use at least 6 characters.';
                status.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                status.className = 'status error';
                status.textContent = 'Passwords do not match.';
                status.style.display = 'block';
                return;
            }

            if (!actionCode) {
                status.className = 'status error';
                status.textContent = 'The recovery link is missing a valid reset code.';
                status.style.display = 'block';
                return;
            }

            try {
                await confirmPasswordReset(auth, actionCode, password);
                status.className = 'status success';
                status.textContent = 'Password updated successfully. Redirecting to login...';
                status.style.display = 'block';
                form.reset();
                setTimeout(() => window.location.href = 'login.html', 1800);
            } catch (error) {
                status.className = 'status error';
                status.textContent = error.message;
                status.style.display = 'block';
            }
        });
    </script>
</body>
</html>
