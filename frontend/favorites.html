<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Favorites | Atlas Property Group</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
background:#f5f7fa;
font-family:Arial,sans-serif;
margin:0;
}

.container{
max-width:1300px;
margin:auto;
padding:40px;
}

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;

}

.header h1{

color:#0B3D91;

}

.back-btn{

background:#0B3D91;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:8px;

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:25px;

}

.card{

background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}

.card img{

width:100%;
height:220px;
object-fit:cover;

}

.info{

padding:20px;

}

.price{

font-size:24px;
font-weight:bold;
color:#0B3D91;
margin-bottom:10px;

}

.address{

color:#666;
margin-bottom:20px;

}

.buttons{

display:flex;
gap:10px;

}

button{

flex:1;
padding:12px;
border:none;
cursor:pointer;
border-radius:8px;

}

.view{

background:#0B3D91;
color:white;

}

.remove{

background:#d9534f;
color:white;

}

.empty{

background:white;
padding:50px;
border-radius:12px;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>My Favorite Properties</h1>

<a href="dashboard.html" class="back-btn">

Dashboard

</a>

</div>

<div id="favorites-list">

<div class="empty">

Loading Favorites...

</div>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/helpers.js"></script>
<script src="js/protect.js"></script>

<script src="js/favorites.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
